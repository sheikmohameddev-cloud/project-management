services:
  - type: web
    name: saas-backend
    env: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saas-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: saas-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: "*"
    dockerCommand: "gunicorn core.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"

  - type: worker
    name: saas-celery
    env: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saas-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: saas-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: saas-backend
          envVarKey: SECRET_KEY
    dockerCommand: "celery -A core worker -l info"

  - type: redis
    name: saas-redis
    region: frankfurt
    plan: free
    ipAllowList: []

  - type: web
    name: saas-frontend
    env: static
    buildCommand: ""  # No build command needed for vanilla HTML/JS
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /api/*
        destination: https://saas-backend.onrender.com/api/*
      - type: rewrite
        source: /ws/*
        destination: https://saas-backend.onrender.com/ws/*
      - type: rewrite
        source: /*
        destination: /pages/index.html

databases:
  - name: saas-db
    region: frankfurt
    plan: free
    databaseName: saas
    user: saas
